name: repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: environment
        shell: bash
        run: |
          set +e
          uv run --python 3.13 --with polars==2.1.0 python -c "import platform, sys, polars; print(platform.platform(), '|', sys.version.split()[0], '| polars', polars.__version__)"
      - name: run repro
        shell: bash
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          set +e
          uv run --python 3.13 --with polars==2.1.0 python repro.py --rounds 3000 2>&1 | tee crash.log
          code=${PIPESTATUS[0]}
          round=$(grep -E '^[0-9]+$' crash.log | tail -1)
          echo "exit code: ${code}, last round: ${round}"
          {
            echo "### repro / ${{ matrix.os }} / polars 2.1.0"
            echo ""
            echo "- exit code: ${code}"
            echo "- last round before exit: ${round}"
            echo ""
            echo '```'
            tail -n 25 crash.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${code}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.os }}
          path: crash.log

  control:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: run repro with polars preloaded on the main thread
        shell: bash
        run: |
          set +e
          uv run --python 3.13 --with polars==2.1.0 python repro.py --preload --rounds 3000
          code=$?
          {
            echo "### control / ${{ matrix.os }} / polars 2.1.0 / --preload"
            echo ""
            echo "- exit code: ${code} (0 = no crash)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${code}"

  versions:
    strategy:
      fail-fast: false
      matrix:
        polars: ['1.44.2', '2.0.0', '2.1.0']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: environment
        shell: bash
        run: |
          set +e
          uv run --python 3.13 --with polars==${{ matrix.polars }} python -c "import platform, sys, polars; print(platform.platform(), '|', sys.version.split()[0], '| polars', polars.__version__)"
      - name: run repro
        shell: bash
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          set +e
          uv run --python 3.13 --with polars==${{ matrix.polars }} python repro.py --rounds 3000 2>&1 | tee crash.log
          code=${PIPESTATUS[0]}
          round=$(grep -E '^[0-9]+$' crash.log | tail -1)
          echo "exit code: ${code}, last round: ${round}"
          {
            echo "### versions / windows-latest / polars ${{ matrix.polars }}"
            echo ""
            echo "- exit code: ${code}"
            echo "- last round before exit: ${round}"
            echo ""
            echo '```'
            tail -n 25 crash.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${code}"
